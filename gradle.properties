# 2 GB is enough for this project. With a higher limit the daemon grows to use it, and the Kotlin daemon gets the same
# limit.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official
# Idle Gradle daemons stop after 15 minutes, so that they do not hold memory between builds.
org.gradle.daemon.idletimeout=900000
# Gradle starts its daemon on the Java version in gradle/gradle-daemon-jvm.properties, whichever JDK starts Gradle. It
# does not find the JDK that comes with Android Studio by itself, so the folder is listed here; on a computer without
# that folder, Gradle looks for Java 21 in the usual places.
org.gradle.java.installations.paths=C:/Program Files/Android/Android Studio/jbr
